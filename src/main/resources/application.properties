# Configuration Spring Boot
spring.application.name=Aporia
server.port=8080

# DEBUG - \u00c0 AJOUTER TEMPORAIREMENT
logging.level.org.springframework.boot=DEBUG
logging.level.org.springframework.web=DEBUG

# Afficher les valeurs des variables (NE PAS LAISSER EN PRODUCTION)
spring.datasource.url=${DB_URL:NOT_SET}
spring.datasource.username=${DB_USER:NOT_SET}
spring.datasource.password=${DB_PASSWORD:NOT_SET}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration du pool de connexions
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate - NE PAS METTRE DE COMMENTAIRES SUR LA M\u00caME LIGNE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Configuration de session
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=30m

# Configuration des fichiers upload\u00e9s (optionnel)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Timeout configuration
server.connection-timeout=60000
server.tomcat.connection-timeout=60000
server.tomcat.max-swallow-size=20MB