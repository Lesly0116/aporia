<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aporia - Connexion</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(145deg, #87CEEB 0%, #B0E0E6 50%, #FFFFFF 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            top: -100px;
            right: -100px;
            z-index: 0;
        }
        
        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(135, 206, 235, 0.1);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
            z-index: 0;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(135, 206, 235, 0.3);
            width: 100%;
            max-width: 440px;
            padding: 50px 40px;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .logo {
            font-size: 3.5em;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #87CEEB, #5F9EA0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        
        .login-container p {
            text-align: center;
            color: #718096;
            font-size: 1.1em;
            margin-bottom: 30px;
            font-style: italic;
        }
        
        h2 {
            text-align: center;
            color: #2D3748;
            font-size: 2em;
            font-weight: 600;
            margin-bottom: 30px;
        }
        
        .alert {
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 500;
            animation: slideDown 0.4s ease;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .alert-success {
            background: #C6F6D5;
            color: #22543D;
            border: 1px solid #9AE6B4;
        }
        
        .alert-error {
            background: #FED7D7;
            color: #742A2A;
            border: 1px solid #FC8181;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #4A5568;
            font-weight: 600;
        }
        
        input {
            width: 100%;
            padding: 15px 20px;
            background: #F7FAFC;
            border: 2px solid #E2E8F0;
            border-radius: 15px;
            font-size: 1em;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }
        
        input:focus {
            border-color: #87CEEB;
            background: white;
            outline: none;
            box-shadow: 0 0 0 4px rgba(135, 206, 235, 0.2);
        }
        
        input::placeholder {
            color: #A0AEC0;
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            background: #87CEEB;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        
        .btn:hover {
            background: #5F9EA0;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(95, 158, 160, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .links {
            text-align: center;
            margin-top: 30px;
            color: #718096;
        }
        
        .links a {
            color: #87CEEB;
            text-decoration: none;
            font-weight: 600;
            margin-left: 8px;
            transition: all 0.3s ease;
        }
        
        .links a:hover {
            color: #5F9EA0;
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .login-container {
                padding: 40px 25px;
                width: 90%;
            }
            .logo { font-size: 3em; }
            h2 { font-size: 1.8em; }
            input { padding: 12px 16px; }
            .btn { padding: 14px; }
        }
        
        @media (max-width: 480px) {
            .login-container { padding: 30px 20px; }
            .logo { font-size: 2.5em; }
            h2 { font-size: 1.6em; }
            .btn { padding: 12px; }
            .links { font-size: 0.95em; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">APORIA</div>
        <p> Testez vos connaissances </p>
        
        <h2>Connexion</h2>
        
        <div th:if="${param.inscriptionApo != null}" class="alert alert-success">
                Inscription réussie ! Bienvenue sur Aporia.
        </div>
        
        <div th:if="${erreur != null}" class="alert alert-error" th:text="${erreur}"></div>
        
        <form action="#" th:action="@{/loginAporian}" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="votre@email.com"/>
            </div>
            
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required placeholder="••••••••"/>
            </div>
            
            <button type="submit" class="btn">
                     Se Connecter
            </button>
        </form>
        
        <div class="links">
            Pas encore de compte ? 
            <a href="/inscriptionApo">S'inscrire</a>
        </div>
    </div>
</body>
</html>
