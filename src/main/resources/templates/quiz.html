<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aporia - Quiz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(145deg, #87CEEB 0%, #B0E0E6 50%, #FFFFFF 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(135, 206, 235, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .logo {
            font-size: 2em;
            font-weight: 800;
            background: linear-gradient(135deg, #87CEEB, #5F9EA0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .user-email {
            color: #4A5568;
            font-weight: 500;
            background: #F7FAFC;
            padding: 8px 15px;
            border-radius: 25px;
            border: 1px solid #E2E8F0;
        }
        
        .logout {
            color: #87CEEB;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .logout:hover {
            background: #87CEEB;
            color: white;
        }
        
        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .quiz-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(135, 206, 235, 0.1);
        }
        
        .quiz-info {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .info-badge {
            background: #87CEEB;
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 0.9em;
            font-weight: 600;
        }
        
        .progress {
            color: #4A5568;
            font-weight: 600;
            background: #F7FAFC;
            padding: 8px 20px;
            border-radius: 25px;
        }
        
        .question-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(135, 206, 235, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .question-title {
            font-size: 1.2em;
            color: #2D3748;
            margin-bottom: 25px;
            font-weight: 600;
            line-height: 1.6;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .option {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: #F7FAFC;
            border: 2px solid #E2E8F0;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .option:hover {
            border-color: #87CEEB;
            background: white;
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(135, 206, 235, 0.1);
        }
        
        .option input[type="radio"] {
            margin-right: 15px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #87CEEB;
        }
        
        .option label {
            cursor: pointer;
            flex: 1;
            color: #4A5568;
            font-size: 1em;
        }
        
        .quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .btn {
            padding: 15px 30px;
            background: #87CEEB;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            min-width: 150px;
        }
        
        .btn:hover {
            background: #5F9EA0;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(95, 158, 160, 0.3);
        }
        
        .btn:disabled {
            background: #CBD5E0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .btn-secondary {
            background: white;
            color: #87CEEB;
            border: 2px solid #87CEEB;
        }
        
        .btn-secondary:hover {
            background: #F7FAFC;
            color: #5F9EA0;
            border-color: #5F9EA0;
        }
        
        .timer {
            font-size: 1.2em;
            font-weight: 700;
            color: #87CEEB;
            background: #F7FAFC;
            padding: 10px 20px;
            border-radius: 25px;
            border: 2px solid #87CEEB;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .empty-state h3 {
            color: #2D3748;
            margin-bottom: 10px;
        }
        
        .empty-state p {
            color: #718096;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .quiz-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .quiz-info {
                justify-content: center;
            }
            
            .quiz-footer {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
            
            .timer {
                order: -1;
                width: 100%;
                text-align: center;
            }
        }
        
        @media (max-width: 480px) {
            .question-card {
                padding: 20px;
            }
            
            .option {
                padding: 12px 15px;
            }
            
            .question-title {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">APORIA</div>
        <div class="user-info">
            <span class="user-email" th:text="|👤 ${session.utilisateurConnecte.email}|"></span>
            <a href="/logout" class="logout">Déconnexion</a>
        </div>
    </div>
    
    <div class="quiz-container">
        <div class="quiz-header">
            <div class="quiz-info">
                <span class="info-badge" th:text="${session.categorieChoisie}">Catégorie</span>
                <span class="info-badge" th:text="${session.niveauChoisi}">Niveau</span>
            </div>
            <div class="progress" th:if="${not #lists.isEmpty(quizList)}">
                Question <span id="current-question">1</span>/<span th:text="${#lists.size(quizList)}">10</span>
            </div>
        </div>
        
        <div th:if="${#lists.isEmpty(quizList)}" class="empty-state">
            <h3> Aucun quiz disponible</h3>
            <p>Désolé, il n'y a pas encore de quiz dans cette catégorie avec ce niveau.</p>
            <a href="/selection" class="btn">Choisir d'autres options</a>
        </div>
        
        <div th:if="${not #lists.isEmpty(quizList)}">
            <form id="quizForm" th:action="@{/repondre}" method="post">
                <input type="hidden" id="totalQuestionsHidden" th:value="${#lists.size(quizList)}" />
                
                <div th:each="quiz, stat : ${quizList}" class="question-card" 
                     th:id="'question-' + ${stat.index}" 
                     th:attr="data-question-id=${quiz.id}"
                     th:style="${stat.index > 0} ? 'display: none;' : ''">
                    
                    <div class="question-title" th:text="'Q' + ${stat.index + 1} + '. ' + ${quiz.question}">
                        Question
                    </div>
                    
                    <div class="options">
                        <div th:each="reponse, repStat : ${__${'reponses_' + quiz.id}__}" class="option">
                            <input type="radio" 
                                   th:name="'reponse_' + ${quiz.id}" 
                                   th:id="'opt_' + ${quiz.id} + '_' + ${repStat.index}"
                                   th:value="${reponse}"
                                   th:onchange="'saveAnswer(' + ${quiz.id} + ', this.value)'">
                            <label th:for="'opt_' + ${quiz.id} + '_' + ${repStat.index}" 
                                   th:text="${repStat.index + 1} + '. ' + ${reponse}">
                                Option
                            </label>
                        </div>
                    </div>
                </div>
                
                <div class="quiz-footer">
                    <button type="button" class="btn btn-secondary" id="prevBtn" onclick="changerQuestion(-1)" disabled>← Précédent</button>
                    <span class="timer" id="timer">⏱️ 00:30</span>
                    <button type="button" class="btn" id="nextBtn" onclick="changerQuestion(1)">Suivant →</button>
                    <button type="submit" class="btn" id="submitBtn" style="display: none;">Terminer</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        let currentIndex = 0;
        let totalQuestions = 0;
        let timerInterval;
        let timeLeft = 30;
        
        function initQuiz() {
            const progressSpan = document.querySelector('.progress span:last-child');
            if (progressSpan) {
                totalQuestions = parseInt(progressSpan.textContent) || 0;
            } else {
                const hiddenField = document.getElementById('totalQuestionsHidden');
                totalQuestions = hiddenField ? parseInt(hiddenField.value) || 0 : 0;
            }
            
            if (totalQuestions === 0) return;
            
            document.getElementById('current-question').textContent = '1';
            resetTimer();
        }
        
        function changerQuestion(direction) {
            const newIndex = currentIndex + direction;
            
            if (newIndex < 0 || newIndex >= totalQuestions) return;
            
            document.getElementById('question-' + currentIndex).style.display = 'none';
            currentIndex = newIndex;
            document.getElementById('question-' + currentIndex).style.display = 'block';
            
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            
            if (currentIndex === totalQuestions - 1) {
                document.getElementById('nextBtn').style.display = 'none';
                document.getElementById('submitBtn').style.display = 'block';
            } else {
                document.getElementById('nextBtn').style.display = 'inline-block';
                document.getElementById('submitBtn').style.display = 'none';
            }
            
            document.getElementById('current-question').textContent = currentIndex + 1;
            resetTimer();
        }
        
        function resetTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timeLeft = 30;
            updateTimer();
            timerInterval = setInterval(updateTimer, 1000);
        }
        
        function updateTimer() {
            const timerElement = document.getElementById('timer');
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerElement.textContent = ` ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft === 0) {
                clearInterval(timerInterval);
                if (currentIndex < totalQuestions - 1) {
                    changerQuestion(1);
                } else {
                    document.getElementById('quizForm').submit();
                }
            }
            timeLeft--;
        }
        
        function saveAnswer(quizId, value) {
            console.log(`Réponse sauvegardée pour quiz ${quizId}: ${value}`);
        }
        
        window.onload = initQuiz;
    </script>
</body>
</html>
