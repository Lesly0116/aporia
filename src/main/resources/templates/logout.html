<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aporia - Déconnexion</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(145deg, #87CEEB 0%, #B0E0E6 50%, #FFFFFF 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            top: -100px;
            right: -100px;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(135, 206, 235, 0.1);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
            z-index: 0;
        }

        .logout-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(135, 206, 235, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 50px 40px;
            position: relative;
            z-index: 10;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 3.5em;
            font-weight: 800;
            background: linear-gradient(135deg, #87CEEB, #5F9EA0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            letter-spacing: 3px;
        }

        .checkmark-circle {
            width: 120px;
            height: 120px;
            margin: 20px auto;
            position: relative;
            animation: scaleIn 0.5s ease 0.2s both;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        .checkmark-circle svg {
            width: 100%;
            height: 100%;
        }

        .checkmark-circle circle {
            fill: none;
            stroke: #87CEEB;
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 565.48;
            stroke-dashoffset: 565.48;
            animation: drawCircle 1s ease 0.3s forwards;
        }

        .checkmark-circle path {
            fill: none;
            stroke: #5F9EA0;
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 70;
            stroke-dashoffset: 70;
            animation: drawCheck 0.5s ease 1s forwards;
        }

        @keyframes drawCircle {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes drawCheck {
            to {
                stroke-dashoffset: 0;
            }
        }

        h1 {
            color: #2D3748;
            font-size: 2.2em;
            margin-bottom: 15px;
            font-weight: 600;
            animation: slideUp 0.5s ease 0.8s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        p {
            color: #718096;
            font-size: 1.2em;
            margin-bottom: 30px;
            font-weight: 300;
            animation: slideUp 0.5s ease 1s both;
        }

        .user-email {
            background: #F7FAFC;
            padding: 12px 20px;
            border-radius: 15px;
            margin: 20px 0;
            display: inline-block;
            border: 1px solid #E2E8F0;
            color: #4A5568;
            font-weight: 500;
            animation: slideUp 0.5s ease 1.2s both;
        }

        .user-email span {
            color: #87CEEB;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
            animation: slideUp 0.5s ease 1.4s both;
        }

        .btn {
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            min-width: 150px;
            text-align: center;
        }

        .btn-primary {
            background: #87CEEB;
            color: white;
            box-shadow: 0 8px 15px rgba(135, 206, 235, 0.3);
        }

        .btn-primary:hover {
            background: #5F9EA0;
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(95, 158, 160, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #87CEEB;
            border: 2px solid #87CEEB;
        }

        .btn-secondary:hover {
            background: #F7FAFC;
            border-color: #5F9EA0;
            color: #5F9EA0;
            transform: translateY(-3px);
        }

        .countdown {
            margin-top: 30px;
            color: #A0AEC0;
            font-size: 0.9em;
            animation: fadeIn 0.5s ease 1.6s both;
        }

        .countdown span {
            color: #87CEEB;
            font-weight: 600;
        }

        .footer {
            margin-top: 30px;
            color: #A0AEC0;
            font-size: 0.9em;
            animation: fadeIn 0.5s ease 1.8s both;
        }

        @media (max-width: 480px) {
            .logout-container {
                padding: 30px 20px;
            }
            
            .logo {
                font-size: 2.5em;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            p {
                font-size: 1em;
            }
            
            .btn {
                min-width: 120px;
                padding: 12px 20px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <div class="logo">APORIA</div>
        
        <div class="checkmark-circle">
            <svg viewBox="0 0 200 200">
                <circle cx="100" cy="100" r="90" />
                <path d="M70,100 L90,120 L130,70" />
            </svg>
        </div>
        
        <h1>À bientôt !</h1>
        
        <p>Vous avez été déconnecté avec succès</p>
        
        <div class="user-email" th:if="${email != null}">
            Dernière session : <span th:text="${email}">email@example.com</span>
        </div>
        
        <div class="buttons">
            <a href="/loginAporian" class="btn btn-primary">Se reconnecter</a>
            <a href="/" class="btn btn-secondary">Accueil</a>
        </div>
        
        <div class="countdown">
            Redirection vers l'accueil dans <span id="countdown">5</span> secondes...
        </div>
        
        <div class="footer">
            &copy; 2026 Aporia - Tous droits réservés
        </div>
    </div>

    <script>
        // Compte à rebours et redirection automatique
        let seconds = 5;
        const countdownElement = document.getElementById('countdown');
        
        const interval = setInterval(() => {
            seconds--;
            countdownElement.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = '/';
            }
        }, 1000);
        
        // Option pour annuler la redirection si l'utilisateur clique sur un lien
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', () => {
                clearInterval(interval);
            });
        });
    </script>
</body>
</html>
