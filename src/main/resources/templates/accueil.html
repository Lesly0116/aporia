<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aporia - Accueil</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(145deg, #87CEEB 0%, #B0E0E6 50%, #FFFFFF 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            top: -100px;
            right: -100px;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(135, 206, 235, 0.1);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
            z-index: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(135, 206, 235, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 50px 40px;
            position: relative;
            z-index: 10;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .logo {
            font-size: 3.5em;
            font-weight: 800;
            background: linear-gradient(135deg, #87CEEB, #5F9EA0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            letter-spacing: 3px;
        }

        h1 {
            color: #4A5568;
            font-size: 2.2em;
            margin-bottom: 15px;
            font-weight: 600;
        }

        p {
            color: #718096;
            font-size: 1.2em;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            min-width: 150px;
            text-align: center;
        }

        .btn:first-child {
            background: #87CEEB;
            color: white;
            box-shadow: 0 8px 15px rgba(135, 206, 235, 0.3);
        }

        .btn:last-child {
            background: white;
            color: #87CEEB;
            border: 2px solid #87CEEB;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn:first-child:hover {
            background: #5F9EA0;
            box-shadow: 0 15px 25px rgba(95, 158, 160, 0.4);
        }

        .btn:last-child:hover {
            background: #F7FAFC;
            border-color: #5F9EA0;
            color: #5F9EA0;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            .logo {
                font-size: 2.5em;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            p {
                font-size: 1em;
            }
            
            .btn {
                min-width: 120px;
                padding: 12px 20px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">APORIA</div>
        <h1>Bienvenue sur Aporia</h1>
        <p>Testez vos connaissances avec nos quiz</p>
        
        <div class="buttons">
            <a href="/loginAporian" class="btn">Se connecter</a>
            <a href="/inscriptionApo" class="btn">S'inscrire</a>
        </div>
    </div>
</body>
</html>
